<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes System Design</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes Manager</h1>
      <button id="load-btn">Load Notes</button>
      <p id="status" aria-live="polite"></p>
    </header>

    <main>
      <section class="form-section">
        <h2>Create a Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="title-input">Title (Required, max 100 chars):</label>
            <input type="text" id="title-input" maxlength="100" required>
          </div>

          <div class="form-group">
            <label for="body-input">Body:</label>
            <textarea id="body-input" rows="4"></textarea>
          </div>

          <button type="submit" id="submit-btn">Add Note</button>
        </form>
      </section>

      <section class="list-section">
        <h2>Your Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
