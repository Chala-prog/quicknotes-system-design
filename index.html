<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes System Design</title>
  <link rel="stylesheet" href="style.css" />
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <button id="load-btn">Load notes</button>
    </header>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="create-note-section">
      <h2>Create New Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title *</label>
          <input 
            type="text" 
            id="title-input" 
            name="title" 
            maxlength="100" 
            placeholder="Enter note title (max 100 characters)" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="body-input">Body (optional)</label>
          <textarea 
            id="body-input" 
            name="body" 
            rows="3" 
            placeholder="Enter note content..."
          ></textarea>
        </div>

        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <ul id="notes-list" class="notes-list"></ul>
  </main>
</body>
</html>
