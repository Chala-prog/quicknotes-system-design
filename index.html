<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes System Design</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <button id="load-notes-btn">Load notes</button>
    </header>

    <!-- Task 2: Create Note Form -->
    <section class="create-note-section">
      <h2>Create New Note</h2>
      <form id="create-note-form">
        <div class="form-group">
          <label for="note-title">Title *</label>
          <input 
            type="text" 
            id="note-title" 
            name="title" 
            maxlength="100" 
            placeholder="Enter note title (max 100 characters)" 
            required 
          />
          <small id="title-error" class="error-text" style="display: none; color: red;"></small>
        </div>

        <div class="form-group">
          <label for="note-body">Body (optional)</label>
          <textarea 
            id="note-body" 
            name="body" 
            rows="3" 
            placeholder="Enter note content..."
          ></textarea>
        </div>

        <button type="submit" id="submit-note-btn">Create Note</button>
      </form>
    </section>

    <div id="status-message" role="status" aria-live="polite"></div>

    <section id="notes-list" class="notes-list"></section>
  </main>

  <script src="api.js"></script>
</body>
</html>
